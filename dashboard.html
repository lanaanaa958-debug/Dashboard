<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CodeCraft | Admin Secured</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d1117; color: #c9d1d9; }
        .bg-panel { background-color: #161b22; border: 1px solid #30363d; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyCb03fkh-5y6kWfjAvoVrwzhSW5dbb6QXY",
            authDomain: "vcode-9ebcf.firebaseapp.com",
            projectId: "vcode-9ebcf",
            storageBucket: "vcode-9ebcf.firebasestorage.app",
            messagingSenderId: "448989915791",
            appId: "1:448989915791:web:0930e6ec0d38a074ebdefa",
            measurementId: "G-X1ZFMQG1PP"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Fix Icon Error
        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({
                        root: iconRef.current,
                        attrs: { width: size, height: size, class: className }
                    });
                }
            }, [name, size, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        function App() {
            // Auth States
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [authError, setAuthError] = useState('');
            const [loginEmail, setLoginEmail] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [isLoggingIn, setIsLoggingIn] = useState(false);

            // Dashboard States
            const [activeMenu, setActiveMenu] = useState('dashboard');
            const [isMobileMenuOpen, setMobileMenuOpen] = useState(false);
            
            // UI States (Popups & Notifications)
            const [confirmDelete, setConfirmDelete] = useState(null);
            const [toast, setToast] = useState(null);
            
            // Database States
            const [ideas, setIdeas] = useState([]);
            const [projects, setProjects] = useState([]);
            const [gallery, setGallery] = useState([]);
            
            // Edit States
            const [editingProject, setEditingProject] = useState(null);
            const [editingGallery, setEditingGallery] = useState(null);

            // Form States
            const [projForm, setProjForm] = useState({ title: '', desc: '', demoUrl: '', thumbnail: '' });
            const [galForm, setGalForm] = useState({ caption: '', photoUrl: '' });

            // Fungsi untuk menampilkan notifikasi UI
            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                    if (currentUser) {
                        if (currentUser.email === "putrivanessa092@gmail.com") {
                            setUser(currentUser);
                            setAuthError('');
                        } else {
                            auth.signOut();
                            setAuthError('Akses Ditolak: Anda bukan Admin CodeCraft.');
                            setUser(null);
                        }
                    } else {
                        setUser(null);
                    }
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubIdeas = db.collection('ideas').orderBy('timestamp', 'desc').onSnapshot(snap => {
                    setIdeas(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const unsubProj = db.collection('projects').onSnapshot(snap => {
                    setProjects(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const unsubGal = db.collection('gallery').onSnapshot(snap => {
                    setGallery(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => { unsubIdeas(); unsubProj(); unsubGal(); };
            }, [user]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setAuthError('');
                setIsLoggingIn(true);
                try {
                    await auth.signInWithEmailAndPassword(loginEmail, loginPassword);
                } catch (error) {
                    if (error.code === 'auth/invalid-credential') {
                        setAuthError('Email/Password salah! Pastikan Anda sudah membuat akun ini di Firebase Console.');
                    } else {
                        setAuthError(`Gagal: ${error.message}`);
                    }
                    setLoginPassword('');
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleLogout = () => auth.signOut();

            const updateIdeaStatus = async (id, newStatus) => {
                try {
                    await db.collection('ideas').doc(id).update({ status: newStatus });
                    showToast("Status ide berhasil diperbarui!");
                } catch(e) {
                    showToast("Gagal update status: " + e.message, 'error');
                }
            };
            
            // FITUR PROJECT (TAMBAH & EDIT)
            const handleProjectSubmit = async (e) => {
                e.preventDefault();
                try {
                    if (editingProject) {
                        await db.collection('projects').doc(editingProject).update(projForm);
                        showToast("Project berhasil diupdate!");
                        setEditingProject(null);
                    } else {
                        await db.collection('projects').add(projForm);
                        showToast("Project berhasil ditambahkan!");
                    }
                    setProjForm({ title: '', desc: '', demoUrl: '', thumbnail: '' });
                } catch (e) {
                    showToast("Gagal menyimpan project: " + e.message, 'error');
                }
            };

            const editProject = (p) => {
                setProjForm({ title: p.title, desc: p.desc, demoUrl: p.demoUrl, thumbnail: p.thumbnail || '' });
                setEditingProject(p.id);
                document.getElementById('project-form-container').scrollIntoView({ behavior: 'smooth' });
            };

            const cancelEditProject = () => {
                setProjForm({ title: '', desc: '', demoUrl: '', thumbnail: '' });
                setEditingProject(null);
            };

            // FITUR GALERI (TAMBAH & EDIT)
            const handleGallerySubmit = async (e) => {
                e.preventDefault();
                try {
                    if (editingGallery) {
                        await db.collection('gallery').doc(editingGallery).update(galForm);
                        showToast("Foto berhasil diupdate!");
                        setEditingGallery(null);
                    } else {
                        await db.collection('gallery').add(galForm);
                        showToast("Foto berhasil ditambahkan!");
                    }
                    setGalForm({ caption: '', photoUrl: '' });
                } catch (e) {
                    showToast("Gagal menyimpan foto: " + e.message, 'error');
                }
            };

            const editGallery = (g) => {
                setGalForm({ caption: g.caption, photoUrl: g.photoUrl });
                setEditingGallery(g.id);
                document.getElementById('gallery-form-container').scrollIntoView({ behavior: 'smooth' });
            };

            const cancelEditGallery = () => {
                setGalForm({ caption: '', photoUrl: '' });
                setEditingGallery(null);
            };
            
            // EKSEKUSI HAPUS DARI CUSTOM MODAL
            const executeDelete = async () => {
                if(!confirmDelete) return;
                try {
                    await db.collection(confirmDelete.collection).doc(confirmDelete.id).delete();
                    showToast("Data berhasil dihapus!");
                    setConfirmDelete(null);
                } catch (error) {
                    showToast("Gagal menghapus data: " + error.message, 'error');
                    setConfirmDelete(null);
                }
            };

            const menuItems = [
                { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                { id: 'moderasi', label: 'Moderasi Ide', icon: 'lightbulb' },
                { id: 'project', label: 'Kelola Project', icon: 'folder-code' },
                { id: 'galeri', label: 'Galeri Kegiatan', icon: 'image' }
            ];

            if (authLoading) return <div className="h-screen flex items-center justify-center text-white"><Icon name="loader" className="animate-spin text-indigo-500 mr-2" /> Memeriksa Akses...</div>;

            if (!user) {
                return (
                    <div className="h-screen flex items-center justify-center p-4 relative">
                        <div className="bg-panel border border-[#30363d] p-8 rounded-2xl w-full max-w-sm text-center shadow-2xl relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-purple-600"></div>
                            <div className="w-16 h-16 bg-indigo-600/20 rounded-2xl flex items-center justify-center mx-auto mb-6">
                                <Icon name="lock" size={32} className="text-indigo-400" />
                            </div>
                            <h2 className="text-2xl font-bold text-white mb-2">Admin Portal</h2>
                            <p className="text-sm text-gray-400 mb-8">Akses terbatas hanya untuk administrator CodeCraft.</p>
                            
                            {authError && (
                                <div className="bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-medium p-3 rounded-lg mb-6 text-left leading-relaxed">
                                    <Icon name="alert-circle" size={14} className="inline mr-1 -mt-0.5" /> {authError}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div><input type="email" required value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)} placeholder="Email Admin" className="w-full bg-[#0d1117] border border-[#30363d] rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500 text-sm transition"/></div>
                                <div><input type="password" required value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} placeholder="Password" className="w-full bg-[#0d1117] border border-[#30363d] rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500 text-sm transition"/></div>
                                <button type="submit" disabled={isLoggingIn} className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-3 transition mt-2 shadow-lg shadow-indigo-600/20">
                                    {isLoggingIn ? <Icon name="loader" size={20} className="animate-spin" /> : <Icon name="log-in" size={20} />}
                                    {isLoggingIn ? 'Memproses...' : 'Login ke Dashboard'}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen overflow-hidden relative">
                    {/* CUSTOM NOTIFICATION TOAST */}
                    {toast && (
                        <div className={`fixed top-4 right-4 z-[300] px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-sm font-bold text-white transition-all transform ${toast.type === 'error' ? 'bg-red-500' : 'bg-green-500'}`}>
                            <Icon name={toast.type === 'error' ? 'alert-circle' : 'check-circle'} size={18} />
                            {toast.message}
                        </div>
                    )}

                    {/* CUSTOM CONFIRM DELETE MODAL */}
                    {confirmDelete && (
                        <div className="fixed inset-0 z-[200] bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm transition-all">
                            <div className="bg-panel border border-[#30363d] p-6 rounded-2xl w-full max-w-sm text-center shadow-2xl transform scale-100 transition-all">
                                <div className="w-16 h-16 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-500/20">
                                    <Icon name="alert-triangle" size={32} className="text-red-500" />
                                </div>
                                <h3 className="text-xl font-bold text-white mb-2">Konfirmasi Hapus</h3>
                                <p className="text-gray-400 text-sm mb-6">Apakah Anda yakin ingin menghapus data ini? Tindakan ini permanen.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setConfirmDelete(null)} className="flex-1 py-3 bg-[#21262d] hover:bg-[#30363d] border border-[#30363d] text-white rounded-xl font-medium transition">Batal</button>
                                    <button onClick={executeDelete} className="flex-1 py-3 bg-red-600 hover:bg-red-500 text-white rounded-xl font-medium transition shadow-lg shadow-red-600/20">Ya, Hapus</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Sidebar */}
                    <div className={`fixed inset-y-0 left-0 z-50 w-64 bg-panel border-r border-[#30363d] transform transition-transform duration-300 md:relative md:translate-x-0 flex flex-col ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="flex items-center justify-between p-4 border-b border-[#30363d]">
                            <div className="flex items-center gap-2">
                                <div className="p-1.5 bg-indigo-600 rounded-lg"><Icon name="shield" size={18} className="text-white"/></div>
                                <span className="font-bold text-white">CodeCraft Admin</span>
                            </div>
                            <button onClick={() => setMobileMenuOpen(false)} className="md:hidden"><Icon name="x" size={24} /></button>
                        </div>
                        <div className="p-4 flex-grow space-y-2">
                            <div className="text-xs font-semibold text-gray-500 uppercase mb-4 tracking-wider">Navigation</div>
                            {menuItems.map(item => (
                                <button key={item.id} onClick={() => { setActiveMenu(item.id); setMobileMenuOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-colors ${activeMenu === item.id ? 'bg-indigo-600/10 text-indigo-400 border border-indigo-600/20' : 'text-gray-400 hover:bg-[#21262d] hover:text-white'}`}>
                                    <Icon name={item.icon} size={18} />
                                    <span className="font-medium text-sm">{item.label}</span>
                                </button>
                            ))}
                        </div>
                        <div className="p-4 border-t border-[#30363d]">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-8 h-8 rounded-full bg-indigo-600/20 flex items-center justify-center text-indigo-400 font-bold uppercase">{user.email.charAt(0)}</div>
                                <div className="overflow-hidden"><p className="text-xs text-gray-400 truncate">{user.email}</p></div>
                            </div>
                            <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 px-4 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-500 rounded-lg border border-red-500/20 transition text-sm font-medium">
                                <Icon name="log-out" size={16} /> Logout
                            </button>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col h-screen overflow-y-auto">
                        <header className="sticky top-0 z-40 bg-panel border-b border-[#30363d] px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <button onClick={() => setMobileMenuOpen(true)} className="md:hidden text-gray-400"><Icon name="menu" size={24} /></button>
                                <h1 className="text-lg font-semibold text-white capitalize">{activeMenu.replace('-', ' ')}</h1>
                            </div>
                            <div className="flex items-center gap-4">
                                <span className="flex items-center gap-2 text-xs font-bold text-green-400 bg-green-400/10 px-3 py-1.5 rounded-full border border-green-400/20">
                                    <div className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div> Secure Mode
                                </span>
                            </div>
                        </header>

                        <main className="p-4 md:p-8 max-w-5xl mx-auto w-full">
                            
                            {/* DASHBOARD TAB */}
                            {activeMenu === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="bg-indigo-600/10 border border-indigo-500/20 rounded-2xl p-6 relative overflow-hidden">
                                        <h2 className="text-2xl font-bold text-white mb-2 relative z-10">Pusat Kendali Admin CodeCraft</h2>
                                        <p className="text-gray-400 text-sm relative z-10">Moderasi ide yang masuk dari warga sekolah, kelola project, dan publish galeri kegiatan secara realtime.</p>
                                        <Icon name="shield-check" size={100} className="absolute -right-5 -bottom-5 text-indigo-500/10" />
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div className="bg-panel p-5 rounded-2xl flex items-center justify-between">
                                            <div><p className="text-gray-400 text-sm">Total Ide</p><h3 className="text-2xl font-bold text-white mt-1">{ideas.length}</h3></div>
                                            <div className="p-3 bg-amber-500/10 rounded-xl text-amber-500"><Icon name="lightbulb" size={24}/></div>
                                        </div>
                                        <div className="bg-panel p-5 rounded-2xl flex items-center justify-between">
                                            <div><p className="text-gray-400 text-sm">Total Project</p><h3 className="text-2xl font-bold text-white mt-1">{projects.length}</h3></div>
                                            <div className="p-3 bg-cyan-500/10 rounded-xl text-cyan-500"><Icon name="folder-code" size={24}/></div>
                                        </div>
                                        <div className="bg-panel p-5 rounded-2xl flex items-center justify-between">
                                            <div><p className="text-gray-400 text-sm">Total Galeri</p><h3 className="text-2xl font-bold text-white mt-1">{gallery.length}</h3></div>
                                            <div className="p-3 bg-pink-500/10 rounded-xl text-pink-500"><Icon name="image" size={24}/></div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* MODERASI IDE TAB */}
                            {activeMenu === 'moderasi' && (
                                <div className="space-y-4">
                                    {ideas.map(idea => (
                                        <div key={idea.id} className="bg-panel p-5 rounded-2xl border border-[#30363d]">
                                            <div className="flex justify-between items-start mb-4">
                                                <div>
                                                    <h3 className="font-bold text-white">{idea.sender}</h3>
                                                    <span className={`text-xs px-2 py-1 rounded-md mt-2 inline-block font-bold uppercase tracking-wider ${
                                                        idea.status === 'diterima' ? 'bg-green-500/20 text-green-400 border border-green-500/20' :
                                                        idea.status === 'ditolak' ? 'bg-red-500/20 text-red-400 border border-red-500/20' : 'bg-amber-500/20 text-amber-400 border border-amber-500/20'
                                                    }`}>{idea.status || 'pending'}</span>
                                                </div>
                                                <button onClick={() => setConfirmDelete({collection: 'ideas', id: idea.id})} className="text-gray-500 hover:text-red-400 transition"><Icon name="trash-2" size={18}/></button>
                                            </div>
                                            <p className="text-gray-300 text-sm mb-6 bg-[#0d1117] p-4 rounded-xl border border-[#30363d]">{idea.description}</p>
                                            <div className="flex gap-2">
                                                <button onClick={() => updateIdeaStatus(idea.id, 'diterima')} className="px-4 py-2 bg-green-500/10 hover:bg-green-500/20 text-green-500 text-xs font-bold uppercase rounded-lg border border-green-500/20 transition">Terima Ide</button>
                                                <button onClick={() => updateIdeaStatus(idea.id, 'ditolak')} className="px-4 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-500 text-xs font-bold uppercase rounded-lg border border-red-500/20 transition">Tolak Ide</button>
                                            </div>
                                        </div>
                                    ))}
                                    {ideas.length === 0 && <p className="text-center text-gray-500 py-10 border border-dashed border-[#30363d] rounded-2xl">Belum ada ide yang masuk.</p>}
                                </div>
                            )}

                            {/* KELOLA PROJECT TAB */}
                            {activeMenu === 'project' && (
                                <div className="space-y-6">
                                    <div id="project-form-container">
                                        <form onSubmit={handleProjectSubmit} className={`bg-panel border p-6 rounded-2xl space-y-4 transition-colors ${editingProject ? 'border-amber-500/50 shadow-lg shadow-amber-500/10' : 'border-[#30363d]'}`}>
                                            <div className="flex justify-between items-center mb-4">
                                                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                                                    {editingProject ? <><Icon name="edit" className="text-amber-500"/> Edit Project</> : 'Tambah Project Baru'}
                                                </h3>
                                                {editingProject && <button type="button" onClick={cancelEditProject} className="text-sm text-gray-400 hover:text-white transition">Batal Edit</button>}
                                            </div>
                                            <input required value={projForm.title} onChange={e=>setProjForm({...projForm, title: e.target.value})} placeholder="Judul Project" className="w-full bg-[#0d1117] border border-[#30363d] rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500 text-sm"/>
                                            <textarea required value={projForm.desc} onChange={e=>setProjForm({...projForm, desc: e.target.value})} placeholder="Deskripsi Singkat" className="w-full bg-[#0d1117] border border-[#30363d] rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500 text-sm h-24"></textarea>
                                            <input required value={projForm.demoUrl} onChange={e=>setProjForm({...projForm, demoUrl: e.target.value})} placeholder="Link Demo (https://...)" className="w-full bg-[#0d1117] border border-[#30363d] rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500 text-sm"/>
                                            <input required value={projForm.thumbnail} onChange={e=>setProjForm({...projForm, thumbnail: e.target.value})} placeholder="Link URL Gambar Thumbnail" className="w-full bg-[#0d1117] border border-[#30363d] rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500 text-sm"/>
                                            <button type="submit" className={`w-full text-white font-medium py-3 rounded-xl transition shadow-lg ${editingProject ? 'bg-amber-600 hover:bg-amber-500 shadow-amber-600/20' : 'bg-indigo-600 hover:bg-indigo-500 shadow-indigo-600/20'}`}>
                                                {editingProject ? 'Update Data Project' : 'Publish Project'}
                                            </button>
                                        </form>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        {projects.map(p => (
                                            <div key={p.id} className="bg-panel border border-[#30363d] p-4 rounded-xl flex items-center justify-between group">
                                                <div>
                                                    <h4 className="font-bold text-white">{p.title}</h4>
                                                    <a href={p.demoUrl} target="_blank" className="text-xs text-indigo-400 hover:underline">Lihat Demo</a>
                                                </div>
                                                <div className="flex gap-1">
                                                    <button onClick={() => editProject(p)} className="p-2 text-amber-400 hover:bg-amber-400/10 rounded-lg opacity-0 group-hover:opacity-100 transition"><Icon name="edit" size={18}/></button>
                                                    <button onClick={() => setConfirmDelete({collection: 'projects', id: p.id})} className="p-2 text-red-400 hover:bg-red-400/10 rounded-lg opacity-0 group-hover:opacity-100 transition"><Icon name="trash-2" size={18}/></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* GALERI KEGIATAN TAB */}
                            {activeMenu === 'galeri' && (
                                <div className="space-y-6">
                                    <div id="gallery-form-container">
                                        <form onSubmit={handleGallerySubmit} className={`bg-panel border p-6 rounded-2xl space-y-4 transition-colors ${editingGallery ? 'border-amber-500/50 shadow-lg shadow-amber-500/10' : 'border-[#30363d]'}`}>
                                            <div className="flex justify-between items-center mb-4">
                                                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                                                    {editingGallery ? <><Icon name="edit" className="text-amber-500"/> Edit Foto Galeri</> : 'Tambah Foto Galeri'}
                                                </h3>
                                                {editingGallery && <button type="button" onClick={cancelEditGallery} className="text-sm text-gray-400 hover:text-white transition">Batal Edit</button>}
                                            </div>
                                            <input required value={galForm.caption} onChange={e=>setGalForm({...galForm, caption: e.target.value})} placeholder="Caption Singkat" className="w-full bg-[#0d1117] border border-[#30363d] rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500 text-sm"/>
                                            <input required value={galForm.photoUrl} onChange={e=>setGalForm({...galForm, photoUrl: e.target.value})} placeholder="Link URL Foto" className="w-full bg-[#0d1117] border border-[#30363d] rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500 text-sm"/>
                                            <button type="submit" className={`w-full text-white font-medium py-3 rounded-xl transition shadow-lg ${editingGallery ? 'bg-amber-600 hover:bg-amber-500 shadow-amber-600/20' : 'bg-indigo-600 hover:bg-indigo-500 shadow-indigo-600/20'}`}>
                                                {editingGallery ? 'Update Galeri' : 'Publish ke Galeri'}
                                            </button>
                                        </form>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        {gallery.map(g => (
                                            <div key={g.id} className="bg-panel border border-[#30363d] rounded-xl overflow-hidden relative group">
                                                <img src={g.photoUrl} alt={g.caption} className="w-full h-32 object-cover"/>
                                                <div className="absolute bottom-0 w-full bg-gradient-to-t from-black to-transparent p-3 pt-6">
                                                    <p className="text-sm text-white font-medium truncate">{g.caption}</p>
                                                </div>
                                                <div className="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition">
                                                    <button onClick={() => editGallery(g)} className="p-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg shadow-lg"><Icon name="edit" size={14}/></button>
                                                    <button onClick={() => setConfirmDelete({collection: 'gallery', id: g.id})} className="p-2 bg-red-500 hover:bg-red-600 text-white rounded-lg shadow-lg"><Icon name="trash-2" size={14}/></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
